services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: loan-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 5s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loan-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      UseInMemoryDatabase: "false"
      ConnectionStrings__LoanDb: "Server=sqlserver,1433;Database=LoanDb;User Id=sa;Password=Your_password123!;Encrypt=False;TrustServerCertificate=True"
      Cors__AllowedOrigins__0: "http://localhost:4200"
    ports:
      - "5000:8080"

volumes:
  sqlserver-data:
