<h2 mat-dialog-title>Apply Payment</h2>

<mat-dialog-content>
  <p class="dialog-subtitle">
    <strong>{{ data.loan.applicantName }}</strong> —
    current balance: <strong>{{ data.loan.currentBalance | currency }}</strong>
  </p>

  <form [formGroup]="form" (ngSubmit)="submit()" class="dialog-form">
    <mat-form-field appearance="outline">
      <mat-label>Payment amount</mat-label>
      <span matTextPrefix>$&nbsp;</span>
      <input
        matInput
        type="number"
        formControlName="amount"
        [max]="maxAmount"
        min="0.01"
        step="0.01"
      />
      @if (form.controls.amount.touched && form.controls.amount.errors?.['min']) {
        <mat-error>Amount must be greater than zero.</mat-error>
      }
    </mat-form-field>

    @if (serverError(); as message) {
      <p class="dialog-error" role="alert">{{ message }}</p>
    }
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button type="button" mat-button (click)="cancel()" [disabled]="submitting()">
    Cancel
  </button>
  <button type="button" mat-flat-button color="primary" (click)="submit()" [disabled]="submitting()">
    {{ submitting() ? 'Processing...' : 'Pay' }}
  </button>
</mat-dialog-actions>
