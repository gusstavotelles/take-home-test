<h2 class="dialog__title">Apply Payment</h2>
<p class="dialog__subtitle">
  {{ data.loan.applicantName }} —
  current balance {{ data.loan.currentBalance | currency }}
</p>

<form [formGroup]="form" (ngSubmit)="submit()" class="dialog__form">
  <mat-form-field appearance="outline">
    <mat-label>Payment amount</mat-label>
    <input
      matInput
      type="number"
      formControlName="amount"
      [max]="maxAmount"
      min="0.01"
      step="0.01"
    />
    @if (form.controls.amount.touched && form.controls.amount.errors?.['min']) {
      <mat-error>Amount must be greater than zero.</mat-error>
    }
  </mat-form-field>

  @if (serverError(); as message) {
    <p class="dialog__error" role="alert">{{ message }}</p>
  }

  <div class="dialog__actions">
    <button type="button" mat-stroked-button (click)="cancel()" [disabled]="submitting()">
      Cancel
    </button>
    <button type="submit" mat-flat-button color="primary" [disabled]="submitting()">
      {{ submitting() ? 'Processing...' : 'Pay' }}
    </button>
  </div>
</form>
